name: Update EuroJackpot archive

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 2,5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: rarity-rules-refresh

      - name: Download official LOTTO Bayern archive
        run: python3 scripts/update_eurojackpot_archive.py

      - name: Commit archive when changed
        run: |
          if git diff --quiet -- src/main/resources/eurojackpot_archiv.csv; then
            echo "Archive already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/resources/eurojackpot_archiv.csv
            git commit -m "Update EuroJackpot archive"
            git push origin HEAD:rarity-rules-refresh
          fi
