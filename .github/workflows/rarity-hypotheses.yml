name: Rarity hypotheses

on:
  push:
    branches:
      - rarity-rules-refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Refresh official EuroJackpot archive
        run: python3 scripts/update_eurojackpot_archive.py

      - name: Commit refreshed local archive
        run: |
          if git diff --quiet -- src/main/resources/eurojackpot_archiv.csv; then
            echo "Archive already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/resources/eurojackpot_archiv.csv
            git commit -m "Update EuroJackpot archive [skip ci]"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run all tests against committed-format local archive
        run: ./mvnw test
