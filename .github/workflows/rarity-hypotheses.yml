name: Rarity hypotheses

on:
  push:
    branches:
      - rarity-hypothesis-tests
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run rarity hypothesis tests
        run: ./mvnw -Dtest=RareCombinationHypothesesTest test
